
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fake News Detector</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  background: #f0f4fa;
  color: #172554;
}

header {
  background: #102a56;
  color: white;
  text-align: center;
  padding: 25px;
}

header h1 {
  font-size: 30px;
  margin-bottom: 8px;
}

.container {
  max-width: 750px;
  margin: 55px auto;
  padding: 30px;
  background: white;
  border-radius: 15px;
  box-shadow: 0 5px 20px #0001;
}

h2 {
  text-align: center;
  margin-bottom: 15px;
}

p {
  text-align: center;
  color: #64748b;
  margin-bottom: 20px;
}

textarea {
  width: 100%;
  height: 170px;
  padding: 15px;
  border: 1px solid #cbd5e1;
  border-radius: 10px;
  font-size: 16px;
  resize: vertical;
}

button {
  width: 100%;
  padding: 15px;
  margin-top: 20px;
  background: #2563eb;
  color: white;
  border: none;
  border-radius: 9px;
  font-size: 17px;
  cursor: pointer;
}

button:hover {
  background: #1d4ed8;
}

#result {
  display: none;
  margin-top: 25px;
  padding: 20px;
  border-radius: 10px;
  text-align: center;
}

#result h3 {
  margin-bottom: 10px;
}

#result p {
  margin: 0;
  color: inherit;
}

.note {
  margin-top: 20px;
  font-size: 13px;
  text-align: center;
}

footer {
  text-align: center;
  padding: 20px;
  color: #64748b;
}
</style>
</head>

<body>

<header>
  <h1>📰 TruthCheck</h1>
  <p style="color:white">Fake News Detection System</p>
</header>

<div class="container">

  <h2>Verify Your News</h2>

  <p>
    Paste a news headline or article below
    to check its credibility.
  </p>

  <textarea id="news"
    placeholder="Enter your news article here...">
  </textarea>

  <button onclick="checkNews()">
    Check News
  </button>

  <div id="result">
    <h3 id="status"></h3>
    <p id="message"></p>
    <p id="score"></p>
  </div>

  <div class="note">
    This is a demonstration prototype, not a
    verified fact-checking service.
  </div>

</div>

<footer>
  © 2026 TruthCheck | Fake News Detector
</footer>

<script>

function checkNews() {

  let news = document.getElementById("news")
                  .value.trim();

  let result = document.getElementById("result");
  let status = document.getElementById("status");
  let message = document.getElementById("message");
  let score = document.getElementById("score");

  if (news.length < 20) {
    alert("Please enter at least 20 characters.");
    return;
  }

  let suspiciousWords = [
    "shocking",
    "breaking",
    "100% guaranteed",
    "secret revealed",
    "share immediately",
    "miracle cure",
    "you won't believe",
    "forward to everyone"
  ];

  let text = news.toLowerCase();
  let count = 0;

  suspiciousWords.forEach(word => {
    if (text.includes(word)) {
      count++;
    }
  });

  result.style.display = "block";

  if (count >= 2) {

    status.innerText = "⚠ Possibly Suspicious";
    message.innerText =
      "This text contains multiple sensational phrases. Verify it using trusted sources.";

    score.innerText = "Suspicious phrase count: " + count;

    result.style.background = "#fee2e2";
    result.style.color = "#991b1b";

  } else {

    status.innerText = "🔎 Needs Verification";
    message.innerText =
      "No strong warning signs were detected by this basic demo. This does not mean the news is true.";

    score.innerText = "Suspicious phrase count: " + count;

    result.style.background = "#dbeafe";
    result.style.color = "#1e40af";
  }

}

</script>

</body>
</html>
